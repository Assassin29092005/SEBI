[project]
name = "drhp-studio"
version = "0.1.0"
description = "AI-assisted SME IPO offer document drafter (SEBI ICDR Chapter IX)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdf>=4.0",
    "pyjwt>=2.8",
    "cryptography>=42",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "pymupdf>=1.24",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Non-.py data files the package reads at runtime (app.schema.loader.load_checklist()
# is called at main.py import time, so a wheel missing this crashes on startup, not on
# first request). "packages.find" above only decides which PYTHON PACKAGES ship; without
# this, setuptools silently drops non-.py files from a real (non-editable) build — a real
# install (pip install ./backend) or a Docker image built from this pyproject would start,
# import cleanly, then fail with SchemaIntegrityError the moment anything touched the
# checklist. `pip install -e` never surfaces this: an editable install just points back at
# the source tree, where these files are already sitting on disk regardless of what's
# declared here.
[tool.setuptools.package-data]
app = ["intake/question_copy.yaml", "schema/checklists/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic-generated revision scripts — not hand-maintained code.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI system evaluates these per-request, not once at def time like a
# real mutable default — the B008 warning is a false positive for this pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.auth.dependencies.require_roles"]
