[project]
name = "drhp-studio"
version = "0.1.0"
description = "AI-assisted SME IPO offer document drafter (SEBI ICDR Chapter IX)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdf>=4.0",
    "pyjwt>=2.8",
    "cryptography>=42",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI system evaluates these per-request, not once at def time like a
# real mutable default — the B008 warning is a false positive for this pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.auth.dependencies.require_roles"]
