name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch/PR supersedes the old one — no point running
# (or paying for) two overlapping test runs, and this keeps the deploy job
# from potentially racing an older commit's build against main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drhp
          POSTGRES_PASSWORD: drhp_dev_password
          POSTGRES_DB: drhp_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drhp -d drhp_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend + dev deps
        run: pip install -e "backend[dev]"

      - name: Create test database
        run: PGPASSWORD=drhp_dev_password psql -h localhost -U drhp -d drhp_studio -c "CREATE DATABASE drhp_studio_test"

      - name: Apply migrations (dev DB)
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Apply migrations (test DB)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://drhp:drhp_dev_password@localhost:5432/drhp_studio_test
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Lint
        run: python -m ruff check backend

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build (includes tsc type-check)
        working-directory: frontend
        run: npm run build

  # Builds both container images (see backend/Dockerfile, frontend/Dockerfile)
  # on every push/PR — a Dockerfile regression is a real break even if the
  # app's own tests pass, and this is the only thing in this repo that
  # actually builds them (Docker isn't available in every contributor's dev
  # environment either). Publishing to GHCR only happens on a push to main,
  # and only after backend+frontend both pass — broken code never becomes a
  # pullable image, which is the actual safety guarantee behind "changes
  # ship safely."
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            dockerfile: backend/Dockerfile
          - image: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR image names must be lowercase; github.repository ("Owner/Repo")
      # isn't guaranteed to be, and isn't here.
      - name: Compute lowercase image name
        id: vars
        run: |
          echo "repo_lc=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main) the ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lc }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.vars.outputs.repo_lc }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
